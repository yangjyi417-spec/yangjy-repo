<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>杨静怡 · 作品集（复古桌面版）</title>
<style>
/* ============ Fonts ============ */
@font-face{font-family:'Press Start 2P';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/press-start-2p.woff2') format('woff2');}

/* ============ Tokens ============ */
:root{
  --chrome:#c9c9c9; --chrome-lt:#e3e3e3; --chrome-dk:#9a9a9a;
  --line:#111; --ink:#141414; --ink-soft:#3a3a3a; --muted:#6b6b6b;
  --paper:#fbfaf4; --paper-2:#f1eee2;
  --blue:#2b5fd0; --blue-dk:#173d94; --teal:#0e8f86; --gold:#e0a416;
  --red:#e0413f; --yellow:#f2b705; --green:#39b54a; --purple:#7b4fd0;
  --pixel:'Press Start 2P','Courier New',monospace;
  --ui:'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Noto Sans SC',system-ui,sans-serif;
  --bar-h:26px; --dock-h:74px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--ui);color:var(--ink);background:#12233a;overflow:hidden;-webkit-font-smoothing:antialiased;}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer}
a{color:var(--blue-dk)}

/* ============ Wallpaper ============ */
#wallpaper{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:
    radial-gradient(120% 80% at 78% 18%, rgba(255,241,196,.95) 0%, rgba(255,214,140,0) 34%),
    linear-gradient(180deg,#20315f 0%,#3b4f8f 22%,#7a5aa0 40%,#d9736b 54%,#f0a860 60%,#ffd98a 63%,#1f6fae 63.5%,#2f8bc4 74%,#3fa0d6 82%,#e8d3a2 82.5%,#d9bd84 100%);
}
#wallpaper .sun{position:absolute;left:74%;top:14%;width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle at 50% 45%,#fff6d8,#ffe08a 60%,#ffcf5e);
  box-shadow:0 0 60px 20px rgba(255,220,140,.55);}
#wallpaper .sea-grid{position:absolute;left:0;right:0;top:63.5%;height:19%;opacity:.35;
  background:
    repeating-linear-gradient(0deg,rgba(255,255,255,.5) 0 1px,transparent 1px 26px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.45) 0 1px,transparent 1px 60px);
  transform:perspective(220px) rotateX(62deg);transform-origin:top;}
#wallpaper .palm{position:absolute;bottom:16%;image-rendering:pixelated;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}
#wallpaper .palm.l{left:2%;width:150px}
#wallpaper .palm.r{right:6%;width:200px;bottom:15%}
#crt{position:fixed;inset:0;z-index:9998;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 1px,transparent 1px 3px);mix-blend-mode:multiply;opacity:.5}
#vig{position:fixed;inset:0;z-index:9997;pointer-events:none;box-shadow:inset 0 0 220px rgba(0,0,0,.45)}

/* ============ Menu bar ============ */
#menubar{position:fixed;top:0;left:0;right:0;height:var(--bar-h);z-index:5000;display:flex;align-items:center;
  background:linear-gradient(#efefef,#cfcfcf);border-bottom:1px solid #000;font-size:13px;padding:0 8px;gap:2px;user-select:none}
#menubar .mb-logo{display:flex;align-items:center;gap:6px;padding:0 12px 0 4px;font-weight:800}
#menubar .mb-logo svg{width:18px;height:18px}
#menubar .mb-logo b{font-family:var(--pixel);font-size:9px;letter-spacing:.5px;color:#111}
.mb-menu{position:relative}
.mb-item{padding:2px 10px;border-radius:0;line-height:22px;color:#111}
.mb-item:hover,.mb-item.open{background:var(--blue);color:#fff}
.mb-clock{margin-left:auto;padding:0 8px;font-family:var(--pixel);font-size:9px;color:#111;white-space:nowrap;display:flex;gap:8px;align-items:center}
.mb-clock .cn{font-family:var(--ui);font-size:12px;font-weight:700}
.dropdown{position:absolute;top:24px;left:0;min-width:210px;background:#f4f4f4;border:1px solid #000;box-shadow:3px 3px 0 rgba(0,0,0,.35);padding:4px;display:none;z-index:5100}
.dropdown.show{display:block}
.dropdown button{display:flex;width:100%;align-items:center;gap:9px;text-align:left;background:none;border:0;padding:6px 9px;font-size:13px;color:#111;border-radius:3px}
.dropdown button:hover{background:var(--blue);color:#fff}
.dropdown button .di{width:18px;height:18px;flex:0 0 auto}
.dropdown .sep{height:1px;background:#bdbdbd;margin:4px 6px}

/* ============ Desktop ============ */
#desktop{position:fixed;top:var(--bar-h);left:0;right:0;bottom:var(--dock-h);z-index:100}
#icons{position:absolute;top:14px;left:14px;display:flex;flex-direction:column;flex-wrap:wrap;gap:6px;max-height:calc(100% - 20px);width:96px}
.dicon{width:88px;padding:8px 4px 6px;border:1px dashed transparent;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;border-radius:6px}
.dicon .glyph{width:46px;height:46px;display:grid;place-items:center}
.dicon .glyph svg{width:44px;height:44px;image-rendering:pixelated;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.25))}
.dicon .cap{font-size:12px;font-weight:700;color:#fff;text-shadow:1px 1px 0 #000,0 0 4px rgba(0,0,0,.6);text-align:center;line-height:1.25;padding:1px 4px;border-radius:3px}
.dicon.sel .cap{background:var(--blue);text-shadow:none}
.dicon.sel .glyph{filter:drop-shadow(0 0 0 #000)}
.dicon.sel .glyph svg{opacity:.8}
.dicon:focus{outline:none}
.dicon:focus-visible .cap{outline:2px solid #fff}

/* ============ Window ============ */
.win{position:absolute;min-width:280px;background:var(--paper);border:1px solid #000;border-radius:8px;
  box-shadow:0 14px 40px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.4) inset;display:flex;flex-direction:column;overflow:hidden}
.win.active{box-shadow:0 20px 60px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.5) inset}
.win.min{display:none}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0}
.tbar{height:34px;flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 10px;cursor:grab;
  background:linear-gradient(#e9e9e9,#c6c6c6);border-bottom:1px solid #000;position:relative;user-select:none}
.tbar:active{cursor:grabbing}
.win:not(.active) .tbar{background:linear-gradient(#f2f2f2,#dcdcdc)}
.lights{display:flex;gap:9px;flex:0 0 auto;background:rgba(0,0,0,.08);border:1px solid rgba(0,0,0,.18);border-radius:100px;padding:4px 8px}
.light{width:17px;height:17px;border-radius:50%;border:1.5px solid rgba(0,0,0,.6);display:grid;place-items:center;padding:0;font-size:12px;font-weight:900;line-height:1;color:#111;box-shadow:0 1px 0 rgba(255,255,255,.55) inset;transition:transform .08s}
.light:hover{transform:scale(1.22)}
.light:active{transform:scale(.9)}
.light.close{background:var(--red);color:#fff} .light.mini{background:var(--yellow);color:#5a3d00} .light.maxi{background:var(--green);color:#fff}
.tbar .t-title{position:absolute;left:0;right:0;text-align:center;font-weight:800;font-size:13px;color:#111;pointer-events:none;letter-spacing:.3px}
.tbar .t-title .en{font-family:var(--pixel);font-size:8px;color:#777;margin-left:6px;vertical-align:middle}
.wbody{overflow:auto;padding:18px 20px 26px;flex:1 1 auto;scrollbar-width:thin;scrollbar-color:#b5b5b5 transparent}
.wbody::-webkit-scrollbar{width:11px}
.wbody::-webkit-scrollbar-thumb{background:#b5b5b5;border:2px solid var(--paper);border-radius:8px}
.wbody::-webkit-scrollbar-track{background:var(--paper-2)}

/* ============ Window content: shared retro blocks ============ */
.kicker{font-family:var(--pixel);font-size:9px;color:var(--teal);letter-spacing:1px;margin:0 0 6px}
.w-title{font-size:22px;font-weight:900;margin:0 0 4px;letter-spacing:.5px;display:flex;align-items:center;gap:10px}
.w-title .bar{width:10px;height:22px;background:var(--blue);box-shadow:2px 0 0 var(--gold)}
.w-desc{color:var(--ink-soft);font-size:14px;line-height:1.8;margin:6px 0 18px;max-width:64ch}
.panel{background:#fff;border:1px solid #000;border-radius:6px;box-shadow:3px 3px 0 rgba(0,0,0,.18);padding:16px 18px;margin-bottom:16px}
.panel h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
.panel h3::before{content:"";width:14px;height:14px;background:var(--gold);border:1px solid #000;display:inline-block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.info-row{display:flex;gap:10px;padding:7px 0;border-bottom:1px dotted #cfcfcf;font-size:14px}
.info-row .k{flex:0 0 96px;color:var(--muted);font-weight:700}
.info-row .v{color:var(--ink);font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:12.5px;font-weight:700;color:#123;background:#eef;border:1px solid #000;border-radius:100px;padding:4px 12px;box-shadow:1px 1px 0 #000}
.chip{font-size:12.5px;font-weight:800;color:#fff;padding:5px 12px;border:1px solid #000;border-radius:100px;box-shadow:2px 2px 0 rgba(0,0,0,.25)}
.chip.c1{background:var(--blue)}.chip.c2{background:var(--teal)}.chip.c3{background:var(--purple)}.chip.c4{background:var(--gold);color:#222}.chip.c5{background:var(--red)}
.selfbig{font-size:18px;font-weight:900;margin-bottom:6px}

/* awards */
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.award{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid #000;border-radius:6px;box-shadow:3px 3px 0 rgba(0,0,0,.15);padding:10px 12px}
.award .medal{font-size:24px;flex:0 0 auto}
.award .a-t{font-weight:800;font-size:13.5px;line-height:1.3}
.award .a-s{color:var(--muted);font-size:12px;margin-top:2px}

/* work item */
.item{background:#fff;border:1px solid #000;border-radius:8px;box-shadow:4px 4px 0 rgba(0,0,0,.16);padding:16px 18px;margin-bottom:18px}
.item-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.num{font-family:var(--pixel);font-size:16px;color:#fff;background:var(--blue);border:1px solid #000;border-radius:5px;padding:7px 8px;box-shadow:2px 2px 0 rgba(0,0,0,.25);flex:0 0 auto;line-height:1}
.item-title{font-size:17px;font-weight:900;line-height:1.35;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.item-sub{font-family:var(--pixel);font-size:8px;color:#888;margin-top:5px;letter-spacing:.5px}
.badge{font-size:11px;font-weight:800;color:#222;background:var(--gold);border:1px solid #000;border-radius:100px;padding:2px 10px;box-shadow:1px 1px 0 #000}
.item-body p{font-size:14px;line-height:1.85;color:var(--ink-soft);margin:0 0 10px}
.item-body ul{margin:6px 0 10px;padding-left:20px}
.item-body li{font-size:14px;line-height:1.8;color:var(--ink-soft);margin-bottom:6px}
.item-body strong{color:var(--ink)}
.item-body em{color:var(--blue-dk);font-style:italic}

/* pixel buttons / links */
.links{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 4px}
.btn{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:800;color:#111;text-decoration:none;
  background:linear-gradient(#fdfdfd,#dcdcdc);border:1px solid #000;border-radius:5px;padding:8px 13px;box-shadow:2px 2px 0 #000;transition:transform .05s,box-shadow .05s}
.btn:hover{transform:translate(1px,1px);box-shadow:1px 1px 0 #000}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 #000}
.btn .ar{font-family:var(--pixel);font-size:9px;color:var(--blue-dk)}
.btn.acc{background:linear-gradient(#eaf1ff,#c9dbff)}
.inl{color:var(--blue-dk);text-decoration:none;font-weight:700;border-bottom:1px dashed var(--blue)}
.inl:hover{background:#eef}

/* gallery */
.gal{margin-top:14px;border-top:1px dashed #c4c4c4;padding-top:14px}
.gal-label{font-family:var(--pixel);font-size:8px;color:#999;margin:0 0 8px;letter-spacing:.5px}
.big{position:relative;border:1px solid #000;border-radius:6px;overflow:hidden;cursor:zoom-in;box-shadow:3px 3px 0 rgba(0,0,0,.18);max-width:520px;background:#000}
.big img{width:100%;height:auto;max-height:340px;object-fit:contain}
.big .zoom{position:absolute;right:8px;bottom:8px;font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.6);border:1px solid #fff;border-radius:4px;padding:3px 8px}
.thumbs{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
.thumb{flex:0 0 auto;width:120px;border:1px solid #000;border-radius:5px;overflow:hidden;cursor:zoom-in;background:#000;box-shadow:2px 2px 0 rgba(0,0,0,.15)}
.thumb img{width:120px;height:150px;object-fit:cover}
.thumb:hover{outline:2px solid var(--blue);outline-offset:-2px}

/* metrics */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:12px 0 4px}
.metric{background:#111;color:#fff;border:1px solid #000;border-radius:6px;padding:12px 10px;text-align:center;box-shadow:3px 3px 0 rgba(0,0,0,.2)}
.metric-num{font-family:var(--pixel);font-size:15px;color:var(--gold);line-height:1.2}
.metric-label{font-size:12px;color:#cfcfcf;margin-top:6px}

/* timeline */
.timeline{position:relative;padding-left:22px;margin-top:4px}
.timeline::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:repeating-linear-gradient(#000 0 4px,transparent 4px 8px)}
.tl{position:relative;margin-bottom:18px}
.tl::before{content:"";position:absolute;left:-21px;top:4px;width:12px;height:12px;background:var(--blue);border:1px solid #000;border-radius:2px}
.tl-date{font-family:var(--pixel);font-size:8px;color:var(--teal);margin-bottom:4px}
.tl .role{font-weight:900;font-size:14.5px;margin-bottom:6px}
.tl ul{margin:0;padding-left:18px}
.tl li{font-size:13.5px;line-height:1.75;color:var(--ink-soft);margin-bottom:4px}

/* research */
.rs-badge{display:inline-block;font-size:11px;font-weight:800;color:#fff;background:var(--teal);border:1px solid #000;border-radius:100px;padding:3px 11px;box-shadow:1px 1px 0 #000}
.rs-journal{color:var(--muted);font-size:13px;margin:8px 0}
.rs-title{font-size:16px;font-weight:900;line-height:1.45;margin:6px 0 2px}
.rs-title-cn{color:var(--ink-soft);font-size:14px;margin:2px 0 8px}
.rs-abs{font-size:13.5px;line-height:1.85;color:var(--ink-soft);margin:8px 0}
.rs-meta{margin-top:10px;font-size:13px;color:var(--ink-soft);display:grid;gap:6px}
.rs-meta .mk{display:inline-block;min-width:62px;font-weight:800;color:var(--blue-dk)}
.paper{background:#fff;border:1px solid #000;border-radius:6px;box-shadow:3px 3px 0 rgba(0,0,0,.15);padding:14px 15px;margin-bottom:14px}
.ptag{font-size:11px;font-weight:800;color:#fff;border:1px solid #000;border-radius:100px;padding:2px 10px;box-shadow:1px 1px 0 #000}
.ptag.ei{background:var(--teal)}.ptag.conf{background:var(--blue)}.ptag.res{background:var(--purple)}
.paper h4{margin:9px 0 6px;font-size:15px;line-height:1.45}
.paper p{font-size:13px;line-height:1.8;color:var(--ink-soft);margin:0 0 8px}
.paper .role{font-size:12.5px;color:var(--blue-dk);font-weight:700}

/* web build IA */
.wb-point{background:#fff;border:1px solid #000;border-radius:6px;box-shadow:3px 3px 0 rgba(0,0,0,.15);padding:12px 14px;font-size:13px;line-height:1.75;color:var(--ink-soft)}
.wb-point b{display:block;font-size:14px;color:var(--ink);margin-bottom:4px}
.ia-root{width:max-content;max-width:100%;margin:0 auto 14px;background:var(--blue);color:#fff;font-weight:800;font-size:14px;padding:8px 18px;border:1px solid #000;border-radius:5px;box-shadow:2px 2px 0 #000}
.ia-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.ia-col{background:var(--paper-2);border:1px solid #000;border-radius:5px;padding:10px}
.ia-h{font-size:13px;font-weight:800;color:var(--blue-dk);text-align:center;padding-bottom:6px;margin-bottom:6px;border-bottom:1px dashed #bbb}
.ia-col ul{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.ia-col li{font-size:12.5px;color:var(--ink-soft);text-align:center}

/* AI */
.ai-flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:8px 0 18px}
.ai-step{background:#fff;border:1px solid #000;border-radius:6px;box-shadow:3px 3px 0 rgba(0,0,0,.15);padding:12px}
.ai-n{display:inline-grid;place-items:center;width:26px;height:26px;background:var(--blue);color:#fff;border:1px solid #000;border-radius:4px;font-family:var(--pixel);font-size:10px;margin-bottom:8px}
.ai-step b{display:block;font-size:13.5px;margin-bottom:4px}
.ai-step p{font-size:12px;line-height:1.7;color:var(--ink-soft);margin:0}
.ai-sub{font-size:15px;font-weight:900;margin:6px 0 12px;display:flex;align-items:center;gap:8px}
.ai-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.ai-card{background:#fff;border:1px solid #000;border-radius:6px;box-shadow:3px 3px 0 rgba(0,0,0,.15);overflow:hidden}
.ai-cover{aspect-ratio:16/10;background:#000;overflow:hidden}
.ai-cover img{width:100%;height:100%;object-fit:cover}
.ai-bd{padding:12px 14px 15px}
.ai-name{font-size:14.5px;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:7px}
.ai-tag{font-size:10.5px;font-weight:800;color:#fff;background:var(--teal);border:1px solid #000;border-radius:100px;padding:1px 8px}
.ai-desc{font-size:12.5px;line-height:1.7;color:var(--ink-soft);margin-bottom:10px}

/* welcome */
.wl-hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.wl-photo{width:96px;height:96px;border:1px solid #000;border-radius:8px;overflow:hidden;box-shadow:3px 3px 0 rgba(0,0,0,.25);flex:0 0 auto}
.wl-photo img{width:100%;height:100%;object-fit:cover}
.wl-name{font-size:26px;font-weight:900;margin:0}
.wl-name .dot{color:var(--gold)}
.wl-en{font-family:var(--pixel);font-size:9px;color:var(--teal);margin:6px 0 8px;letter-spacing:.5px}
.wl-lede{font-size:14px;color:var(--ink-soft);line-height:1.75;margin:0}
.hint{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-soft);background:#fff8e0;border:1px solid #000;border-left:6px solid var(--gold);border-radius:5px;padding:11px 14px;margin-top:16px;box-shadow:3px 3px 0 rgba(0,0,0,.12)}
.hint svg{width:26px;height:26px;flex:0 0 auto}

/* contact */
.contact-list{display:grid;gap:12px;margin:6px 0 14px}
.contact-row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #000;border-radius:6px;box-shadow:3px 3px 0 rgba(0,0,0,.15);padding:12px 14px;font-size:15px;font-weight:700}
.contact-row svg{width:24px;height:24px;flex:0 0 auto}
.contact-row small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.foot-line{text-align:center;margin-top:18px;padding-top:16px;border-top:1px dashed #c4c4c4}
.foot-line .ft{font-family:var(--pixel);font-size:12px;color:var(--blue)}
.foot-line .ft .g{color:var(--gold)}
.foot-line .fs{font-size:13px;color:var(--muted);margin-top:8px}

/* works folder browser */
.wcat{font-family:var(--pixel);font-size:10px;color:var(--teal);letter-spacing:1px;margin:20px 0 12px;display:flex;align-items:center;gap:10px}
.wcat span{white-space:nowrap}
.wcat::after{content:"";flex:1;height:0;border-top:2px dotted #b9b9b9}
.wfold{background:#fff;border:1px solid #000;border-radius:6px;box-shadow:3px 3px 0 rgba(0,0,0,.15);padding:12px 14px;margin-bottom:12px}
.wfold-head{display:flex;align-items:center;gap:9px;font-weight:900;font-size:14.5px;margin-bottom:9px;line-height:1.35}
.wfold-head .fic{width:20px;height:20px;flex:0 0 auto}
.wfold-files{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:9px}
.btn.sm{font-size:12px;padding:5px 10px}
.wfold-imgs{display:flex;flex-wrap:wrap;gap:8px}
.wfold-imgs .thumb{width:92px}
.wfold-imgs .thumb img{width:92px;height:116px;object-fit:cover}

/* ============ Dock ============ */
#dock-wrap{position:fixed;left:0;right:0;bottom:0;height:var(--dock-h);z-index:5000;display:flex;justify-content:center;align-items:flex-end;padding-bottom:8px;pointer-events:none}
#dock{pointer-events:auto;display:flex;align-items:flex-end;gap:8px;background:rgba(220,220,220,.72);backdrop-filter:blur(6px);border:1px solid #000;border-bottom:none;border-radius:16px 16px 0 0;padding:8px 12px 6px;box-shadow:0 -4px 18px rgba(0,0,0,.3)}
.dock-item{position:relative;width:46px;height:46px;display:grid;place-items:center;background:none;border:0;transition:transform .12s ease}
.dock-item svg{width:40px;height:40px;image-rendering:pixelated;filter:drop-shadow(1px 2px 1px rgba(0,0,0,.3))}
.dock-item:hover{transform:translateY(-10px) scale(1.18)}
.dock-item .run{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:#111;opacity:0}
.dock-item.running .run{opacity:1}
.dock-item.min .run{background:#fff;border:1px solid #111}
.dock-sep{width:1px;height:40px;background:rgba(0,0,0,.35);margin:0 2px;align-self:center}

/* ============ Lightbox ============ */
#lightbox{position:fixed;inset:0;z-index:9000;background:rgba(10,10,14,.92);display:none;align-items:center;justify-content:center;padding:40px}
#lightbox.open{display:flex}
#lightbox img{max-width:92vw;max-height:86vh;border:2px solid #fff;box-shadow:0 10px 40px rgba(0,0,0,.6);object-fit:contain}
.lb-btn{position:absolute;background:rgba(255,255,255,.12);border:1px solid #fff;color:#fff;width:44px;height:44px;border-radius:6px;font-size:22px;line-height:1}
.lb-btn:hover{background:var(--blue)}
#lbClose{top:18px;right:18px}#lbPrev{left:18px;top:50%;transform:translateY(-50%)}#lbNext{right:18px;top:50%;transform:translateY(-50%)}
#lbCount{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:#fff;font-family:var(--pixel);font-size:11px}

/* ============ Boot ============ */
#boot{position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;color:#fff;transition:opacity .5s}
#boot.gone{opacity:0;pointer-events:none}
#boot svg{width:78px;height:78px;image-rendering:pixelated}
#boot .bt{font-family:var(--pixel);font-size:13px;letter-spacing:1px}
#boot .bs{width:180px;height:14px;border:2px solid #fff;border-radius:2px;padding:2px}
#boot .bs i{display:block;height:100%;width:0;background:#fff;animation:bootbar 1.1s ease forwards}
@keyframes bootbar{to{width:100%}}
#boot .skip{position:absolute;bottom:26px;font-size:12px;color:#888}

/* ============ Mobile ============ */
#flow{display:none}
body.mobile{overflow:auto;background:#0f1e33}
body.mobile #icons,body.mobile #desktop,body.mobile #dock-wrap,body.mobile .mb-menu{display:none!important}
body.mobile #menubar{padding-right:6px}
body.mobile #menubar .mb-logo{padding-left:8px}
body.mobile #wallpaper{position:fixed}
body.mobile #flow{display:block;position:relative;z-index:100;padding:calc(var(--bar-h) + 12px) 12px 24px;max-width:720px;margin:0 auto}
body.mobile .mwin{background:var(--paper);border:1px solid #000;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.4);margin-bottom:14px;overflow:hidden}
body.mobile .mwin .tbar{cursor:default}
body.mobile .mwin .lights{display:none}
body.mobile .mwin .wbody{overflow:visible;padding:16px 14px 20px}
body.mobile .big{max-width:100%}
body.mobile .grid2{grid-template-columns:1fr}
body.mobile .hint{display:none}
body.mobile #vig,body.mobile #crt{display:none}

@media (max-width:820px){ .mb-clock .cn{display:none} }
</style>
</head>

<script>
/* ============ App registry ============ */
const APPS=[
  {id:'welcome', title:'欢迎',        en:'HOME',     icon:'computer', tpl:'tpl-welcome',  w:560,h:500},
  {id:'works',   title:'作品文件夹',  en:'ALL WORKS',icon:'folder',   tpl:'works',        w:860,h:620},
  {id:'about',   title:'关于我',      en:'ABOUT',    icon:'person',   tpl:'tpl-about',    w:680,h:540},
  {id:'planning',title:'创意策划',    en:'PLAN',     icon:'bulb',     tpl:'tpl-planning', w:700,h:560},
  {id:'writing', title:'文案撰写',    en:'WRITE',    icon:'pen',      tpl:'tpl-writing',  w:700,h:560},
  {id:'media',   title:'新媒体运营',  en:'MEDIA',    icon:'play',     tpl:'tpl-media',    w:700,h:560},
  {id:'design',  title:'设计展示',    en:'DESIGN',   icon:'palette',  tpl:'tpl-design',   w:700,h:560},
  {id:'research',title:'科研经历',    en:'RESEARCH', icon:'flask',    tpl:'tpl-research', w:680,h:560},
  {id:'webbuild',title:'网站搭建',    en:'WEB',      icon:'globe',    tpl:'tpl-webbuild', w:680,h:540},
  {id:'ai',      title:'AI 技能',     en:'AI',       icon:'robot',    tpl:'tpl-ai',       w:760,h:560},
];
const appById=id=>APPS.find(a=>a.id===id);

/* ============ 作品文件夹：聚合全部图与文件 ============ */
const WORK_TPLS=[
  {cat:'创意策划',   tpl:'tpl-planning', sel:'.item'},
  {cat:'文案撰写',   tpl:'tpl-writing',  sel:'.item'},
  {cat:'新媒体运营', tpl:'tpl-media',    sel:'.item'},
  {cat:'设计展示',   tpl:'tpl-design',   sel:'.item'},
  {cat:'科研论文',   tpl:'tpl-research', sel:'.paper'},
  {cat:'AI 作品',    tpl:'tpl-ai',       sel:'.ai-card'},
];
const FILE_NAME={
  'canva.pdf':'Canva 可画高校营销推广策划案',
  'qianwen.pdf':'阿里云千问大模型营销策划案',
  'lanxinfeng.pdf':'蓝信封 · 春季通信大使校园招募',
  'shazhou.pdf':'青春沙洲 · 红色旅游年轻化方案',
  'zhengwen-zhagen.pdf':'《扎根人民沃土 书写时代答卷》',
  'zhengwen-caomu.pdf':'《自然与人生的交响乐——草木人间》读后感',
  'zhengwen-jingmo.pdf':'《静默如坛，回声如海》',
  'zhengwen-hongchen.pdf':'《红尘镜影，女儿心语织梦华》',
  'feishu-fupan.pdf':'飞鼠 IP 运营复盘',
  'banshi.pdf':'杂志版式设计作品',
  'feiyi-paper.pdf':'非遗微短剧论文原文',
};
function cleanTxt(t){return (t||'').replace(/[↗→]/g,'').replace(/\s{2,}/g,' ').trim();}
function titleOf(item){
  const h=item.querySelector('.item-title, .ai-name, h4');
  if(!h)return '';
  const c=h.cloneNode(true);
  c.querySelectorAll('.badge, .ai-tag, .ptag').forEach(n=>n.remove());
  return cleanTxt(c.textContent);
}
function fileNameFrom(href){return href.split('/').pop().split(/[?#]/)[0];}
function linkBtns(item){
  const seen={},out=[];
  item.querySelectorAll('a[href]').forEach(a=>{
    const href=a.getAttribute('href');
    if(!href||href==='#'||seen[href])return;seen[href]=1;
    if(/^files\//.test(href)){
      const fn=fileNameFrom(href);
      out.push('<a class="btn sm" href="'+href+'" target="_blank" rel="noopener">📄 '+(FILE_NAME[fn]||fn)+'</a>');
    }else{
      const label=cleanTxt(a.textContent)||href;
      out.push('<a class="btn sm" href="'+a.href+'" target="_blank" rel="noopener">🔗 '+label+'</a>');
    }
  });
  return out.length?'<div class="wfold-files">'+out.join('')+'</div>':'';
}
function imgThumbs(item,gkey){
  const imgs=[];
  item.querySelectorAll('[data-src]').forEach(el=>imgs.push({g:el.dataset.group,src:el.dataset.src}));
  item.querySelectorAll('.ai-cover img').forEach(im=>{const s=im.getAttribute('src');if(s)imgs.push({g:gkey,src:s});});
  if(!imgs.length)return '';
  return '<div class="wfold-imgs">'+imgs.map(o=>'<div class="thumb" data-group="'+o.g+'" data-src="'+o.src+'"><img src="'+o.src+'" loading="lazy"></div>').join('')+'</div>';
}
function buildWorks(){
  const wrap=document.createElement('div');
  const intro=document.createElement('div');intro.className='w-desc';intro.style.marginBottom='4px';
  intro.textContent='这里收录了作品集里的每一张图片与每一份文件——点图片可放大翻看，点文件在新标签打开原文。';
  wrap.appendChild(intro);
  WORK_TPLS.forEach((cfg,ci)=>{
    const tplEl=document.getElementById(cfg.tpl);if(!tplEl)return;
    const box=document.createElement('div');
    box.appendChild(tplEl.content.cloneNode(true));
    const items=[...box.querySelectorAll(cfg.sel)];
    if(!items.length)return;
    const cat=document.createElement('div');cat.className='wcat';cat.innerHTML='<span>'+cfg.cat+'</span>';wrap.appendChild(cat);
    items.forEach((it,ii)=>{
      const title=titleOf(it)||(cfg.cat+' '+(ii+1));
      const gkey='ai-'+ci+'-'+ii;
      const card=document.createElement('div');card.className='wfold';
      card.innerHTML='<div class="wfold-head"><svg class="fic"><use href="#ic-folder"/></svg><span class="wt">'+title+'</span></div>'+linkBtns(it)+imgThumbs(it,gkey);
      wrap.appendChild(card);
    });
  });
  return wrap;
}
function fillBody(a){
  if(a.tpl==='works')return buildWorks();
  const t=document.getElementById(a.tpl);
  return t?t.content.cloneNode(true):document.createTextNode('');
}

/* ============ Clock ============ */
function tick(){
  const d=new Date(),wk=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  const hh=String(d.getHours()).padStart(2,'0'),mm=String(d.getMinutes()).padStart(2,'0');
  const cn=document.getElementById('clock-cn'),en=document.getElementById('clock-en');
  if(cn)cn.textContent=(d.getMonth()+1)+'月'+d.getDate()+'日 '+wk;
  if(en)en.textContent=hh+':'+mm;
}
tick();setInterval(tick,1000*20);

/* ============ Build desktop icons + dock + go menu ============ */
const iconsEl=document.getElementById('icons'),dockEl=document.getElementById('dock'),ddGo=document.getElementById('dd-go');
APPS.forEach(a=>{
  const b=document.createElement('button');b.className='dicon';b.dataset.open=a.id;b.type='button';b.title=a.title;
  b.innerHTML='<span class="glyph"><svg><use href="#ic-'+a.icon+'"/></svg></span><span class="cap">'+a.title+'</span>';
  iconsEl.appendChild(b);
});
APPS.forEach(a=>{
  const it=document.createElement('button');it.className='dock-item';it.dataset.open=a.id;it.title=a.title;it.type='button';
  it.innerHTML='<svg><use href="#ic-'+a.icon+'"/></svg><span class="run"></span>';
  dockEl.appendChild(it);
});
const sep=document.createElement('div');sep.className='dock-sep';dockEl.appendChild(sep);
const trash=document.createElement('button');trash.className='dock-item';trash.title='回收站（暂无内容）';trash.type='button';
trash.innerHTML='<svg><use href="#ic-trash"/></svg>';trash.addEventListener('click',()=>alert('回收站是空的 🙂'));dockEl.appendChild(trash);
APPS.forEach(a=>{const b=document.createElement('button');b.type='button';b.dataset.open=a.id;b.innerHTML='<svg class="di"><use href="#ic-'+a.icon+'"/></svg>'+a.title;ddGo.appendChild(b);});

/* ============ Window manager ============ */
const desktop=document.getElementById('desktop');
const wins={};let zTop=100,cascade=0;
function focusWin(w){zTop++;w.style.zIndex=zTop;Object.values(wins).forEach(x=>x.el.classList.toggle('active',x.el===w));syncDock();}
function clampPos(x,y,el){const maxX=desktop.clientWidth-el.offsetWidth-6;const maxY=desktop.clientHeight-el.offsetHeight-6;return[Math.max(4,Math.min(x,Math.max(4,maxX))),Math.max(4,Math.min(y,Math.max(4,maxY)))];}
function openWindow(id){
  const a=appById(id);if(!a)return;
  if(wins[id]){const w=wins[id];w.el.classList.remove('min');focusWin(w.el);return;}
  const el=document.createElement('section');el.className='win';el.dataset.id=id;
  const W=Math.min(a.w,desktop.clientWidth-20),H=Math.min(a.h,desktop.clientHeight-20);
  el.style.width=W+'px';el.style.height=H+'px';
  const off=(cascade++%6)*26;
  let x=desktop.clientWidth/2-W/2+off-70, y=26+off;
  el.style.left=Math.max(6,x)+'px';el.style.top=y+'px';
  el.innerHTML=
    '<div class="tbar"><div class="lights">'+
      '<button class="light close" title="关闭">×</button><button class="light mini" title="最小化">–</button><button class="light maxi" title="最大化">+</button>'+
    '</div><div class="t-title">'+a.title+'<span class="en">'+a.en+'</span></div></div>'+
    '<div class="wbody"></div>';
  const body=el.querySelector('.wbody');
  body.appendChild(fillBody(a));
  desktop.appendChild(el);
  wins[id]={el,a};
  el.querySelector('.light.close').onclick=e=>{e.stopPropagation();closeWin(id);};
  el.querySelector('.light.mini').onclick=e=>{e.stopPropagation();el.classList.add('min');syncDock();};
  el.querySelector('.light.maxi').onclick=e=>{e.stopPropagation();el.classList.toggle('max');};
  el.addEventListener('pointerdown',()=>focusWin(el),true);
  makeDraggable(el);
  wireContent(el);
  // keep inside on tiny screens
  requestAnimationFrame(()=>{const[p,q]=clampPos(parseFloat(el.style.left),parseFloat(el.style.top),el);el.style.left=p+'px';el.style.top=q+'px';});
  focusWin(el);syncDock();
}
function closeWin(id){if(!wins[id])return;wins[id].el.remove();delete wins[id];syncDock();}
function closeAll(){Object.keys(wins).forEach(closeWin);}
function makeDraggable(el){
  const bar=el.querySelector('.tbar');
  bar.addEventListener('pointerdown',e=>{
    if(e.target.closest('.light'))return;
    if(el.classList.contains('max'))return;
    e.preventDefault();focusWin(el);
    const sx=e.clientX,sy=e.clientY,ox=parseFloat(el.style.left),oy=parseFloat(el.style.top);
    bar.setPointerCapture(e.pointerId);
    function mv(ev){el.style.left=(ox+ev.clientX-sx)+'px';el.style.top=Math.max(0,oy+ev.clientY-sy)+'px';}
    function up(ev){bar.releasePointerCapture(e.pointerId);bar.removeEventListener('pointermove',mv);bar.removeEventListener('pointerup',up);
      const[p,q]=clampPos(parseFloat(el.style.left),parseFloat(el.style.top),el);el.style.left=p+'px';el.style.top=q+'px';}
    bar.addEventListener('pointermove',mv);bar.addEventListener('pointerup',up);
  });
}
function syncDock(){
  document.querySelectorAll('.dock-item').forEach(d=>{
    const id=d.dataset.open;if(!id)return;const w=wins[id];
    d.classList.toggle('running',!!w);d.classList.toggle('min',!!w&&w.el.classList.contains('min'));
  });
}

/* ============ Open triggers (icons single-click select, double-click open; dock/menu single-click open) ============ */
iconsEl.addEventListener('click',e=>{const b=e.target.closest('.dicon');if(!b)return;document.querySelectorAll('.dicon.sel').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');});
iconsEl.addEventListener('dblclick',e=>{const b=e.target.closest('.dicon');if(b)openWindow(b.dataset.open);});
// keyboard: focused icon Enter opens
iconsEl.addEventListener('keydown',e=>{if(e.key==='Enter'){const b=e.target.closest('.dicon');if(b)openWindow(b.dataset.open);}});
document.addEventListener('click',e=>{
  const opener=e.target.closest('[data-open]');
  if(opener){openWindow(opener.dataset.open);closeMenus();return;}
  const act=e.target.closest('[data-act]');
  if(act&&act.dataset.act==='closeall'){closeAll();closeMenus();}
});

/* ============ Menu dropdowns ============ */
function closeMenus(){document.querySelectorAll('.dropdown.show').forEach(d=>d.classList.remove('show'));document.querySelectorAll('.mb-item.open').forEach(d=>d.classList.remove('open'));}
document.querySelectorAll('.mb-menu>.mb-item').forEach(mi=>{
  mi.addEventListener('click',e=>{e.stopPropagation();const dd=mi.parentElement.querySelector('.dropdown');const was=dd.classList.contains('show');closeMenus();if(!was){dd.classList.add('show');mi.classList.add('open');}});
});
document.addEventListener('click',()=>closeMenus());

/* ============ Lightbox ============ */
const groups={};
function collectGroups(root){root.querySelectorAll('[data-src]').forEach(el=>{const g=el.dataset.group;(groups[g]=groups[g]||[]);if(groups[g].indexOf(el.dataset.src)<0)groups[g].push(el.dataset.src);});}
const lb=document.getElementById('lightbox'),lbImg=document.getElementById('lbImg'),lbCount=document.getElementById('lbCount');
let cur=[],idx=0;
function showImg(i){idx=(i+cur.length)%cur.length;lbImg.src=cur[idx];lbCount.textContent=(idx+1)+' / '+cur.length;}
function openLb(g,src){cur=groups[g];showImg(cur.indexOf(src));lb.classList.add('open');}
function closeLb(){lb.classList.remove('open');}
document.getElementById('lbClose').onclick=closeLb;
document.getElementById('lbPrev').onclick=()=>showImg(idx-1);
document.getElementById('lbNext').onclick=()=>showImg(idx+1);
lb.addEventListener('click',e=>{if(e.target===lb)closeLb();});
document.addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape')closeLb();if(e.key==='ArrowLeft')showImg(idx-1);if(e.key==='ArrowRight')showImg(idx+1);});

/* ============ Wire cloned window content ============ */
function wireContent(root){
  collectGroups(root);
  root.querySelectorAll('[data-src]').forEach(el=>{
    if(el._wired)return;el._wired=1;
    el.addEventListener('click',ev=>{ev.stopPropagation();openLb(el.dataset.group,el.dataset.src);});
  });
}

/* ============ WeChat: strip target=_blank so links actually open ============ */
(function(){var ua=(navigator.userAgent||'').toLowerCase();if(/micromessenger|wxwork|wechat/.test(ua)){document.querySelectorAll('template a[target="_blank"]').forEach(a=>a.removeAttribute('target'));}})();

/* ============ Mobile fallback ============ */
function buildMobile(){
  document.body.classList.add('mobile');
  const flow=document.getElementById('flow');
  APPS.forEach(a=>{
    const w=document.createElement('div');w.className='mwin';
    w.innerHTML='<div class="tbar"><div class="t-title">'+a.title+'<span class="en">'+a.en+'</span></div></div><div class="wbody"></div>';
    w.querySelector('.wbody').appendChild(fillBody(a));
    flow.appendChild(w);
  });
  wireContent(flow);
}

/* ============ Boot ============ */
function startOS(){
  const boot=document.getElementById('boot');
  if(boot){boot.classList.add('gone');setTimeout(()=>boot.remove(),600);}
  if(window.matchMedia('(max-width:820px)').matches){buildMobile();}
  else{openWindow('welcome');}
}
window.addEventListener('load',()=>{setTimeout(startOS,1250);});
document.getElementById('boot').addEventListener('click',()=>{const b=document.getElementById('boot');if(b&&!b.classList.contains('gone')){clearTimeout();startOS();}});
</script>
